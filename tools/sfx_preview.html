<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aqua Nova: launch and airlock sounds</title>
<style>
body{margin:0;padding:20px;background:#04101c;color:#bfe;font:16px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}p{margin:4px 0 14px;color:#8ab}
button{display:block;width:100%;margin:8px 0;padding:16px;font-size:17px;border:1px solid #3dd;background:#082634;color:#7fffe0;border-radius:10px}
button:active{background:#0e4658}small{display:block;color:#79a;font-size:13px;margin-top:2px}
</style></head><body>
<h1>Launch and airlock sounds</h1>
<p>Tap each one. Version 2: no musical tones, just steel, air and water. Turn the volume up a little.</p>
<button data-s="airlock">Airlock cycle<small>heavy clunk, pressure hiss, second clunk. No beeps</small></button>
<button data-s="launch">Craft launch (bay)<small>clamps release, doors rumble, a whoosh and a splash away</small></button>
<button data-s="recover">Craft recovery (bay)<small>rising whoosh, clamps catch, doors close, pressurise</small></button>
<button data-s="door">Hatch only<small>one heavy clunk and a short seal hiss</small></button>
<script>
let ac, master;
function init(){ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=0.8; master.connect(ac.destination);} if(ac.state!=='running') ac.resume(); }
const T=()=>ac.currentTime;
function tone(f0,f1,at,dur,vol=0.25,type='sine'){const t=T()+at,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}
let nb; function noise(){ if(!nb){nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;} const s=ac.createBufferSource();s.buffer=nb;s.loop=true;return s;}
// filtered noise with a volume shape and a moving filter: hiss, whoosh, rumble
function hiss(at,dur,{f0=3000,f1=3000,q=0.7,vol=0.3,type='bandpass',attack=0.05}={}){const t=T()+at,s=noise(),f=ac.createBiquadFilter(),g=ac.createGain();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+0.05);}
// a heavy metal clunk: sub thump, a burst of low noise, and a few inharmonic ringing partials (steel, not a beep)
function clunk(at,vol=0.5){
  tone(95,38,at,0.28,vol,'sine');
  hiss(at,0.12,{f0:900,f1:140,vol:vol*0.9,type:'lowpass',q:0.8,attack:0.004});
  [[233,0.5],[391,0.35],[587,0.2]].forEach(([f,k])=>tone(f*1.01,f*0.97,at+0.005,0.22,vol*0.07*k,'sine'));   // dull ring, no clean note
  hiss(at+0.01,0.05,{f0:2600,f1:900,vol:vol*0.25,q:1.5,attack:0.002});
}
// pneumatic seal: a quick burst that tails off, a little irregular
function pfft(at,len=0.7,vol=0.3){hiss(at,len,{f0:6500,f1:2200,vol,q:0.5,attack:0.01});hiss(at+0.03,len*0.6,{f0:1800,f1:700,vol:vol*0.5,q:0.5,attack:0.02});}
// slow hydraulic whine under a motion
function hydraulic(at,dur,vol=0.07){const t=T()+at,o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.linearRampToValueAtTime(95,t+dur*0.5);o.frequency.linearRampToValueAtTime(60,t+dur);f.type='lowpass';f.frequency.value=380;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*0.2);g.gain.linearRampToValueAtTime(0.0001,t+dur);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}
const S={
 airlock(){ clunk(0,0.5); hydraulic(0.1,0.7); pfft(0.9,1.8,0.32); hiss(0.9,2.2,{f0:90,f1:70,vol:0.25,type:'lowpass',attack:0.4}); clunk(3.0,0.55); pfft(3.3,0.5,0.18); },
 door(){ clunk(0,0.55); pfft(0.15,0.55,0.25); },
 launch(){
  clunk(0,0.55); clunk(0.3,0.45);                                   // clamps release
  hydraulic(0.5,2.4,0.09); hiss(0.5,2.6,{f0:90,f1:140,vol:0.5,type:'lowpass',q:0.5,attack:0.6}); tone(52,38,0.5,2.6,0.2,'sine');   // doors rumble
  hiss(1.6,1.8,{f0:350,f1:3200,vol:0.36,q:0.7,attack:0.6});         // she slides out
  hiss(2.4,1.5,{f0:2400,f1:600,vol:0.3,q:0.5,attack:0.05});         // water rush
  tone(70,42,2.5,0.5,0.3,'sine');
  clunk(4.1,0.4); },                                               // doors shut behind her
 recover(){
  hiss(0,1.8,{f0:2800,f1:320,vol:0.3,q:0.7,attack:0.7});            // she approaches
  hydraulic(0.8,2.2,0.09); hiss(0.8,2.4,{f0:90,f1:130,vol:0.45,type:'lowpass',q:0.5,attack:0.5}); tone(52,38,0.8,2.4,0.18,'sine');
  clunk(2.2,0.55); clunk(2.5,0.45);                                 // clamps catch
  clunk(3.9,0.5); pfft(4.2,1.6,0.3); }
};
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{try{init();S[b.dataset.s]();}catch(e){}});
</script></body></html>
