<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aqua Nova">
  <meta name="theme-color" content="#04101f">
  <title>Aqua Nova DSV</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="tablet.css">
  <link rel="preload" as="image" href="assets/bridge.webp">
</head>
<body>
  <div id="app">
    <section id="splash">
      <div class="splash-bg"></div>
      <div class="splash-card">
        <h1>Aqua Nova</h1>
        <h2>Deep Sea Vehicle</h2>
        <button id="board-btn" class="btn primary big" disabled>Starting systems…</button>
        <p id="splash-info" class="splash-info"></p>
      </div>
    </section>

    <section id="shell" hidden>
      <div class="scene-wrap" id="scene-wrap">
        <div class="stage" id="stage"></div>
      </div>
      <nav class="dock" id="dock" aria-label="Stations"></nav>
    </section>

    <section id="station" hidden></section>
    <button id="pin" class="pin" hidden aria-label="Open communicator"><img src="assets/comm-pin.webp" alt=""></button>
    <div id="rotate"><p>Turn your iPad sideways.<br><small>Aqua Nova plays in landscape.</small></p></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
