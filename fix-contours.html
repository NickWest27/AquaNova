<!DOCTYPE html>
<html>
<head>
    <title>Fix Contours Setting</title>
</head>
<body>
    <h1>Fixing Contours Setting</h1>
    <pre id="output"></pre>
    <script>
        const output = document.getElementById('output');
        
        // Check current state
        output.textContent += 'Current localStorage:\n';
        output.textContent += localStorage.getItem('aquanova_gameState') + '\n\n';
        
        // Parse and fix
        const stateStr = localStorage.getItem('aquanova_gameState');
        if (stateStr) {
            const state = JSON.parse(stateStr);
            if (state.navigation && state.navigation.displaySettings) {
                output.textContent += 'Found navigation.displaySettings\n';
                if (state.navigation.displaySettings.overlaysVisible) {
                    output.textContent += 'Current contours value: ' + state.navigation.displaySettings.overlaysVisible.contours + '\n';
                    state.navigation.displaySettings.overlaysVisible.contours = true;
                    localStorage.setItem('aquanova_gameState', JSON.stringify(state));
                    output.textContent += 'Set contours to true and saved!\n';
                }
            }
        }
        
        output.textContent += '\nDone! Reload your game.';
    </script>
</body>
</html>
