# Publishes two builds of the game to GitHub Pages:
#   https://nickwest27.github.io/AquaNova/          <- a menu
#   https://nickwest27.github.io/AquaNova/desktop/  <- branch main   (desktop)
#   https://nickwest27.github.io/AquaNova/tablet/   <- branch tablet (iPad, retro)
# Runs on every push to either branch. Needs Settings > Pages > Source = "GitHub Actions".
name: Publish to Pages
on:
  push:
    branches: [main, tablet]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: tablet
          path: tablet-branch
      - name: Assemble the site
        run: |
          mkdir -p _site/desktop _site/tablet
          rsync -a --exclude='.git' --exclude='temp_backup' --exclude='tools/shots' main/ _site/desktop/
          rsync -a --exclude='.git' --exclude='temp_backup' --exclude='tools/shots' tablet-branch/ _site/tablet/
          touch _site/.nojekyll
          # /AquaNova/tablet/ opens the iPad game (the pixel-stage experiment is at /tablet/tablet/retro/), which lives in the tablet/ folder of that build
          printf '<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aqua Nova</title><script>location.replace("tablet/"+location.search)</script><meta http-equiv="refresh" content="0;url=tablet/"><a href="tablet/">Open Aqua Nova</a>' > _site/tablet/index.html
          # /AquaNova/ is a small menu
          printf '<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aqua Nova</title><body style="font:20px sans-serif;background:#0b0f1a;color:#d8e6f2;padding:2rem"><h1>Aqua Nova</h1><p><a style="color:#29adff" href="tablet/">Tablet (retro, iPad)</a></p><p><a style="color:#29adff" href="desktop/">Desktop</a></p></body>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for the artifact to be listed (deploy often fails without this)
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v4
