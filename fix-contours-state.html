<!DOCTYPE html>
<html>
<head>
    <title>Fix Contours State</title>
</head>
<body>
    <h1>Fix Contours State</h1>
    <p>Open developer console and look for the fix result.</p>

    <script type="module">
        import gameStateInstance from '/game/state.js';

        // Get current overlays
        const currentOverlays = gameStateInstance.getProperty('navigation.displaySettings.overlaysVisible') || {};

        console.log('Current overlays state:', currentOverlays);

        // Update contours to true
        gameStateInstance.updateProperty('navigation.displaySettings.overlaysVisible.contours', true);

        // Verify
        const updatedOverlays = gameStateInstance.getProperty('navigation.displaySettings.overlaysVisible');
        console.log('Updated overlays state:', updatedOverlays);
        console.log('Contours is now:', updatedOverlays.contours);

        // Also update the full overlays object to ensure it has all defaults
        const fullOverlays = {
            route: true,
            waypoints: true,
            contours: true,  // ENSURE THIS IS TRUE
            hazards: true,
            traffic: false,
            latLonGrid: true,
            ...updatedOverlays  // Merge with any existing settings
        };

        gameStateInstance.updateProperty('navigation.displaySettings.overlaysVisible', fullOverlays);
        console.log('Final overlays state:', gameStateInstance.getProperty('navigation.displaySettings.overlaysVisible'));

        alert('Contours setting has been fixed! Reload the main game page.');
    </script>
</body>
</html>
